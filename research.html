<!DOCTYPE html>
<html>

<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans:wght@300;400;500;600&family=Source+Serif+4:wght@400;600;700&family=Ubuntu+Mono&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/academicons/1.9.4/css/academicons.min.css">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.2/css/all.min.css">
    <link rel="stylesheet" type="text/css" href="assets/css/style.css" />
    <title>Research | Ruirui Zhong</title>
    <style>
        .bib-button {
            display: inline-block;
            color: var(--pink1);
            text-decoration: none;
            cursor: pointer;
            font-size: 0.9em;
        }
        .bib-content {
            display: none;
            background-color: var(--luka-bib-bg);
            padding: 10px;
            margin: 10px 0;
            border-radius: 8px;
            border: 1px solid var(--luka-bib-border);
            white-space: pre-wrap;
            font-family: monospace;
            font-size: 0.9em;
            overflow: auto;
            max-height: 300px;
        }
    </style>
</head>

<body class="theme-luka">
    <script>
        const bibMetaCache = new Map();

        async function loadBibMeta(bibId) {
            if (bibMetaCache.has(bibId)) {
                return bibMetaCache.get(bibId);
            }

            const response = await fetch(`assets/files/bibtex/${bibId}.bib`);
            if (!response.ok) {
                throw new Error(`Failed to load bib file: ${bibId}.bib`);
            }

            const text = await response.text();
            const doiMatch = text.match(/doi\s*=\s*[{\"]([^}\"]+)[}\"]/i);
            const doi = doiMatch ? doiMatch[1].trim() : "";
            const doiUrl = doi ? (doi.startsWith("http") ? doi : `https://doi.org/${doi}`) : "";
            const meta = { text, doi, doiUrl };
            bibMetaCache.set(bibId, meta);
            return meta;
        }

        async function toggleBib(bibId) {
            const bibContent = document.getElementById(bibId);
            if (bibContent.style.display === "none" || !bibContent.style.display) {
                if (!bibContent.textContent.trim()) {
                    try {
                        const meta = await loadBibMeta(bibId);
                        bibContent.textContent = meta.text;
                    } catch (error) {
                        console.error('Error loading bib file:', error);
                        bibContent.textContent = 'Error loading BibTeX content';
                    }
                }
                bibContent.style.display = "block";
            } else {
                bibContent.style.display = "none";
            }
        }

        function removeScholarLinks() {
            const scholarLinks = document.querySelectorAll('.publication-list a');
            scholarLinks.forEach((link) => {
                if (link.textContent.trim().toLowerCase() !== 'scholar') {
                    return;
                }

                const prev = link.previousSibling;
                const next = link.nextSibling;

                if (prev && prev.nodeType === Node.TEXT_NODE) {
                    prev.textContent = prev.textContent.replace(/\s*\/\s*$/, '');
                    if (!prev.textContent.trim()) {
                        prev.remove();
                    }
                }

                if (next && next.nodeType === Node.TEXT_NODE) {
                    next.textContent = next.textContent.replace(/^\s*\/\s*/, '');
                    if (!next.textContent.trim()) {
                        next.remove();
                    }
                }

                link.remove();
            });
        }

        async function injectDoiButtons() {
            const bibButtons = document.querySelectorAll('.publication-list .bib-button[onclick^="toggleBib"]');

            for (const bibButton of bibButtons) {
                const onclickText = bibButton.getAttribute('onclick') || '';
                const match = onclickText.match(/toggleBib\('([^']+)'\)/);
                if (!match) {
                    continue;
                }

                const bibId = match[1];
                try {
                    const meta = await loadBibMeta(bibId);
                    if (!meta.doiUrl) {
                        continue;
                    }

                    if (bibButton.parentElement.querySelector(`a[data-doi-for="${bibId}"]`)) {
                        continue;
                    }

                    const doiLink = document.createElement('a');
                    doiLink.className = 'bib-button';
                    doiLink.dataset.doiFor = bibId;
                    doiLink.href = meta.doiUrl;
                    doiLink.target = '_blank';
                    doiLink.rel = 'noopener noreferrer';
                    doiLink.textContent = 'DOI';

                    bibButton.parentNode.insertBefore(doiLink, bibButton);
                    bibButton.parentNode.insertBefore(document.createTextNode(' / '), bibButton);
                } catch (error) {
                    console.error(`Error resolving DOI for ${bibId}:`, error);
                }
            }
        }

        async function fetchJSON(path) {
            const resp = await fetch(path);
            if (!resp.ok) return [];
            return resp.json();
        }

        function normalizeLatex(text) {
            let s = text;
            s = s.replace(/\{\\'\\i\}|\\'\\i|\\'i|\\'\{i\}/g, 'í');
            s = s.replace(/\\'a|\\'\{a\}/g, 'á');
            s = s.replace(/\\'e|\\'\{e\}/g, 'é');
            s = s.replace(/\\'o|\\'\{o\}/g, 'ó');
            s = s.replace(/\\'u|\\'\{u\}/g, 'ú');
            s = s.replace(/\\'A|\\'\{A\}/g, 'Á');
            s = s.replace(/\\'E|\\'\{E\}/g, 'É');
            s = s.replace(/\\'O|\\'\{O\}/g, 'Ó');
            s = s.replace(/\\'U|\\'\{U\}/g, 'Ú');
            s = s.replace(/\\"a|\\"\{a\}/g, 'ä');
            s = s.replace(/\\"o|\\"\{o\}/g, 'ö');
            s = s.replace(/\\"u|\\"\{u\}/g, 'ü');
            s = s.replace(/\\"A|\\"\{A\}/g, 'Ä');
            s = s.replace(/\\"O|\\"\{O\}/g, 'Ö');
            s = s.replace(/\\"U|\\"\{U\}/g, 'Ü');
            s = s.replace(/\\~n|\\~\{n\}/g, 'ñ');
            s = s.replace(/\\~N|\\~\{N\}/g, 'Ñ');
            s = s.replace(/\\c\{c\}/g, 'ç');
            s = s.replace(/[{}]/g, '');
            s = s.replace(/\\/g, '');
            return s;
        }

        function formatAuthors(authors) {
            if (!authors) return '';

            const toInitials = (name) => name
                .split(/[\s-]+/)
                .filter(Boolean)
                .map((part) => part[0].toUpperCase() + '.')
                .join(' ');

            const normalized = normalizeLatex(authors);
            const parts = normalized.split(/\s+and\s+/i).map((a) => a.trim()).filter(Boolean);
            const formatted = parts.map((author) => {
                if (author.toLowerCase() === 'others') {
                    return 'et al.';
                }

                if (author.includes(',')) {
                    const [last, firsts] = author.split(',', 2).map((p) => p.trim());
                    const initials = toInitials(firsts || '');
                    return initials ? `${initials} ${last}` : last;
                }

                const tokens = author.split(/\s+/).filter(Boolean);
                if (tokens.length === 1) return tokens[0];
                const last = tokens[tokens.length - 1];
                const initials = toInitials(tokens.slice(0, -1).join(' '));
                return initials ? `${initials} ${last}` : last;
            });

            let s = formatted.join(', ');
            s = s.replace(/\bR\.\s+Zhong\b/g, '<b><u>R Zhong</u></b>');
            return s;
        }

        async function loadPublications() {
            const journals = await fetchJSON('assets/files/publications/journals.json');
            const conferences = await fetchJSON('assets/files/publications/conferences.json');

            const jList = document.getElementById('journals-list');
            const cList = document.getElementById('conferences-list');

            function renderItem(rec) {
                const li = document.createElement('li');
                const title = document.createElement('span');
                title.className = 'pub-title';
                title.textContent = rec.title || '';
                li.appendChild(title);
                li.appendChild(document.createElement('br'));

                const authors = document.createElement('span');
                authors.innerHTML = formatAuthors(rec.authors || '');
                li.appendChild(authors);
                li.appendChild(document.createElement('br'));

                const venue = document.createElement('span');
                venue.className = 'research-journal-title';
                venue.textContent = rec.venue || '';
                li.appendChild(venue);
                if (rec.year) {
                    li.appendChild(document.createTextNode(', ' + rec.year));
                }
                li.appendChild(document.createElement('br'));

                if (rec.bibId) {
                    const bibBtn = document.createElement('span');
                    bibBtn.className = 'bib-button';
                    bibBtn.setAttribute('onclick', `toggleBib('${rec.bibId}')`);
                    bibBtn.textContent = 'Bib';
                    li.appendChild(bibBtn);

                    const bibDiv = document.createElement('div');
                    bibDiv.id = rec.bibId;
                    bibDiv.className = 'bib-content';
                    li.appendChild(bibDiv);
                }

                return li;
            }

            journals.forEach((r) => jList.appendChild(renderItem(r)));
            conferences.forEach((r) => cList.appendChild(renderItem(r)));
        }

        document.addEventListener('DOMContentLoaded', async () => {
            removeScholarLinks();
            await loadPublications();
            await injectDoiButtons();
        });
    </script>

    <div class="site-shell">
        <header id="header">
            <div class="nav-right">
                <a href="index.html">Home</a>
                <a class="active" href="research.html">Publications</a>
                <a href="awards.html">Awards</a>
                <a href="academic-activities.html">Academic activities</a>
                <a href="projects.html">Project</a>
                <button id="themeToggle" class="theme-toggle" title="Toggle theme" aria-label="Toggle theme"><i class="fa-solid fa-moon"></i></button>
            </div>
        </header>

        <div class="section visible" id="research">
            <h1><u>Publications</u></h1>

            <section class="publications-group">
                <h2 class="others-title">Journal Papers</h2>
                <ol id="journals-list" class="publication-list"></ol>
            </section>

            <section class="publications-group">
                <h2 class="others-title">Conference Papers</h2>
                <ol id="conferences-list" class="publication-list"></ol>
            </section>
        </div>

        <footer class="site-footer">
            <p>
                &copy; 2026 Ruirui Zhong. All rights reserved.
            </p>
        </footer>
    </div>

    <script src="assets/js/site.js"></script>
</body>

</html>
